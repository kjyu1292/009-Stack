apiVersion: v1
kind: Service
metadata:
  name: db-extensions
spec:
  clusterIP: None   # headless — StatefulSets need this for stable DNS
  selector:
    app: db-extensions
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-extensions
spec:
  serviceName: db-extensions
  replicas: 1
  selector:
    matchLabels:
      app: db-extensions
  template:
    metadata:
      labels:
        app: db-extensions
    spec:
      containers:
        - name: postgres
          image: upbase/db-extensions:local
          imagePullPolicy: Never
          env:
            - name: POSTGRES_USER
              value: upbase
            - name: POSTGRES_PASSWORD
              value: upbase123
            - name: POSTGRES_DB
              value: upbase_graph
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: db-extensions-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: db-extensions-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: superset-db-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset-db
  template:
    metadata:
      labels:
        app: superset-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: superset
            - name: POSTGRES_PASSWORD
              value: superset
            - name: POSTGRES_DB
              value: superset
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: superset-db-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: superset-db-data
          persistentVolumeClaim:
            claimName: superset-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: superset-db
spec:
  selector:
    app: superset-db
  ports:
    - port: 5432
      targetPort: 5432

apiVersion: apps/v1
kind: Deployment
metadata:
  name: superset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: superset
  template:
    metadata:
      labels:
        app: superset
    spec:
      containers:
        - name: superset
          image: upbase/superset:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8088
          volumeMounts:
            - name: superset-config
              mountPath: /app/pythonpath/superset_config.py
              subPath: superset_config.py
      volumes:
        - name: superset-config
          configMap:
            name: superset-config
---
apiVersion: v1
kind: Service
metadata:
  name: superset-svc
spec:
  type: NodePort
  selector:
    app: superset
  ports:
    - port: 8088
      targetPort: 8088
      nodePort: 30088
